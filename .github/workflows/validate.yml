name: SYNTRA Social validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate prototype
        run: python scripts/validate.py
      - name: Validate report rate-limit migration
        run: python scripts/test_report_rate_limit_migration.py
      - name: Validate Realtime multi-device sync
        run: python scripts/test_realtime_sync.py
      - name: Validate conflict-safe post editing
        run: python scripts/test_conflict_resolution.py
      - name: Validate offline recovery
        run: python scripts/test_offline_recovery.py
      - name: Validate Cloud data consistency engine
        run: python scripts/test_data_consistency.py
      - name: Validate sync recovery engine
        run: python scripts/test_sync_recovery.py
      - name: Validate multi-device state reconciliation
        run: python scripts/test_state_reconciliation.py
      - name: Validate session isolation guard
        run: python scripts/test_session_isolation.py
      - name: Validate Sync Integrity Monitor
        run: python scripts/test_sync_integrity.py
      - name: Validate background sync queue
        run: python scripts/test_background_sync_queue.py
